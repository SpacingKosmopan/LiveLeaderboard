<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magiczny Sigil - Mocny Inner Shadow</title>
    <style>
      /* Tło i centrowanie */
      body {
        margin: 0;
        padding: 0;
        background-color: #000000; /* Głęboka czerń */
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
      }

      /* Kontener na sigil */
      .sigil-container {
        position: relative;
        width: 400px;
        height: 400px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Delikatna poświata w tle */
      .sigil-container::before {
        content: "";
        position: absolute;
        width: 250px;
        height: 250px;
        background: radial-gradient(
          circle,
          rgba(255, 0, 255, 0.15) 0%,
          rgba(0, 255, 255, 0.08) 50%,
          transparent 70%
        );
        filter: blur(30px);
        animation: pulse 4s infinite ease-in-out;
      }

      .sigil-svg {
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.6;
        }
        50% {
          transform: scale(1.1);
          opacity: 0.9;
        }
      }
    </style>
  </head>
  <body>
    <div class="sigil-container">
      <svg class="sigil-svg" viewBox="0 0 200 200" xmlns="http://w3.org">
        <defs>
          /* Gradienty kolorów */
          <linearGradient
            id="gradient-magic"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="100%"
          >
            <stop offset="0%" stop-color="#ff00ff" />
            <!-- Magenta -->
            <stop offset="50%" stop-color="#4b0082" />
            <!-- Indigo -->
            <stop offset="100%" stop-color="#00ffff" />
            <!-- Cyjan -->
          </linearGradient>

          /* Efekt neonowego świecenia (Glow) dla linii wewnętrznych */
          <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.5" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>

          /* FILTR: Intensywny, mocny wewnętrzny cień w kolorze #0a0e8f */
          <filter
            id="inner-shadow-strong"
            x="-20%"
            y="-20%"
            width="140%"
            height="140%"
          >
            <!-- Zwiększone stdDeviation dla dłuższego, mocniejszego przejścia cienia -->
            <feGaussianBlur stdDeviation="7" result="blur" />
            <feComposite
              operator="out"
              in="SourceGraphic"
              in2="blur"
              result="inverse"
            />
            <!-- Wstrzyknięcie koloru #0a0e8f z pełnym kryciem (flood-opacity="1") -->
            <feFlood flood-color="#0a0e8f" flood-opacity="1" result="color" />
            <feComposite
              operator="in"
              in="color"
              in2="inverse"
              result="shadow"
            />
            <feComposite operator="over" in="shadow" in2="SourceGraphic" />
          </filter>
        </defs>

        <!-- GŁÓWNE KOŁO z mocnym wewnętrznym cieniem #0a0e8f -->
        <circle
          cx="100"
          cy="100"
          r="70"
          fill="#000000"
          stroke="url(#gradient-magic)"
          stroke-width="2.5"
          filter="url(#inner-shadow-strong)"
        />

        <!-- Elementy sigila (linie, księżyce, gwiazdy) -->
        <g
          stroke="url(#gradient-magic)"
          stroke-width="1.5"
          fill="none"
          filter="url(#neon-glow)"
        >
          <!-- Mały wewnętrzny biały okrąg dla kontrastu -->
          <circle cx="100" cy="100" r="30" stroke="#ffffff" stroke-width="1" />

          <!-- Krzyż przecinający środek -->
          <line x1="100" y1="30" x2="100" y2="170" />
          <line x1="30" y1="100" x2="170" y2="100" />

          <!-- Sierp Księżyca (lewy) -->
          <path
            d="M 85,65 A 40,40 0 0,0 85,135 A 30,30 0 0,1 85,65"
            fill="none"
          />

          <!-- Sierp Księżyca (prawy) -->
          <path
            d="M 115,65 A 40,40 0 0,1 115,135 A 30,30 0 0,0 115,65"
            fill="none"
          />

          <!-- Środkowa czteroramienna gwiazda (biel) -->
          <path
            d="M 100,80 Q 100,100 120,100 Q 100,100 100,120 Q 100,100 80,100 Q 100,100 100,80 Z"
            fill="#ffffff"
            stroke="#ffffff"
            stroke-width="1"
          />

          <!-- Małe ozdobne romby na końcach osi -->
          <polygon
            points="100,23 102,28 100,33 98,28"
            fill="#00ffff"
            stroke="#00ffff"
          />
          <polygon
            points="100,167 102,172 100,177 98,172"
            fill="#ff00ff"
            stroke="#ff00ff"
          />
          <polygon
            points="23,100 28,102 33,100 28,98"
            fill="#ff00ff"
            stroke="#ff00ff"
          />
          <polygon
            points="167,100 172,102 177,100 172,98"
            fill="#00ffff"
            stroke="#00ffff"
          />
        </g>
      </svg>
    </div>

    <img src="./unique sigil.png" alt="unique sigil" />
  </body>
</html>
